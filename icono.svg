<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Canal de Agentes: tres círculos que se cruzan, uno por agente; donde coinciden, el canal común. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2724"/>
      <stop offset="1" stop-color="#151311"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#fondo)"/>
  <g style="mix-blend-mode: screen; isolation: isolate">
    <circle cx="32" cy="25.5" r="12.5" fill="#e2683c"/>
    <circle cx="24.5" cy="38.5" r="12.5" fill="#1f9e66" style="mix-blend-mode: screen"/>
    <circle cx="39.5" cy="38.5" r="12.5" fill="#3b76f0" style="mix-blend-mode: screen"/>
  </g>
</svg>
